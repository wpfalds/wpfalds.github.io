<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ 나에게 어울리는 캐릭터는?</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1040;
  --bg2: #241758;
  --star: #ffe066;
  --magic: #b48fff;
  --magic2: #7ee8fa;
  --pink: #ff8fab;
  --green: #80ffb4;
  --text: #f5f0ff;
  --muted: #a090c8;
  --card: rgba(255,255,255,0.06);
  --border: rgba(180,143,255,0.25);
  --shadow: rgba(100,60,255,0.25);
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 별 배경 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180,143,255,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 10% 80%, rgba(126,232,250,0.1) 0%, transparent 50%),
    radial-gradient(ellipse 30% 30% at 90% 60%, rgba(255,143,171,0.1) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
}
.star {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: twinkle var(--d, 3s) ease-in-out infinite;
  animation-delay: var(--delay, 0s);
  opacity: 0;
}
@keyframes twinkle {
  0%,100% { opacity:0; transform: scale(0.5); }
  50% { opacity: var(--op, 0.8); transform: scale(1); }
}

.wrap {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 20px 80px;
  position: relative; z-index: 1;
}

/* ── 인트로 ── */
#screen-intro {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; text-align: center;
  animation: fadeUp 0.8s ease both;
}

.intro-magic {
  font-size: 64px; margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.intro-title {
  font-family: 'Gaegu', cursive;
  font-size: clamp(28px, 7vw, 46px);
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--magic), var(--magic2), var(--star));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.intro-sub {
  font-size: 14px; color: var(--muted);
  line-height: 1.8; margin-bottom: 40px;
  font-weight: 300;
}

.btn-start {
  background: linear-gradient(135deg, #7c3aed, #a855f7, #ec4899);
  color: #fff; border: none;
  border-radius: 100px;
  padding: 18px 56px;
  font-family: 'Gaegu', cursive;
  font-size: 20px; font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 40px rgba(124,58,237,0.5);
  transition: transform 0.2s, box-shadow 0.2s;
  letter-spacing: 0.05em;
}
.btn-start:hover { transform: translateY(-3px); box-shadow: 0 16px 50px rgba(124,58,237,0.6); }

.intro-note {
  margin-top: 20px; font-size: 12px;
  color: var(--muted); letter-spacing: 0.08em;
}

.char-preview {
  display: flex; gap: 10px; flex-wrap: wrap;
  justify-content: center; margin-bottom: 32px;
  max-width: 360px;
}
.char-chip {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12px; color: var(--muted);
  animation: fadeUp 0.5s ease both;
}

/* ── 문항 ── */
#screen-quiz { display: none; padding-top: 48px; }

.progress-wrap { margin-bottom: 28px; }
.progress-label {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--muted); margin-bottom: 8px;
}
.progress-bar {
  height: 5px; background: rgba(255,255,255,0.1);
  border-radius: 100px; overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--magic), var(--magic2));
  border-radius: 100px;
  transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow: 0 0 8px var(--magic);
}

.question-card {
  background: var(--card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 36px 28px 32px;
  box-shadow: 0 8px 48px var(--shadow);
  animation: fadeUp 0.45s ease both;
}

.q-num {
  font-family: 'Gaegu', cursive;
  font-size: 13px; color: var(--magic);
  margin-bottom: 14px; letter-spacing: 0.1em;
}
.q-text {
  font-size: 17px; font-weight: 500;
  line-height: 1.65; margin-bottom: 28px;
  color: var(--text);
}

.options { display: flex; flex-direction: column; gap: 11px; }

.opt-btn {
  background: rgba(255,255,255,0.92);
  border: 1.5px solid rgba(180,143,255,0.3);
  border-radius: 14px;
  padding: 15px 20px;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; color: #1a1040;
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.5;
  position: relative; overflow: hidden;
}
.opt-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, #c4b5fd, #a78bfa);
  opacity: 0; transition: opacity 0.2s;
}
.opt-btn span { position: relative; z-index: 1; color: #1a1040; }
.opt-btn:hover { border-color: var(--magic); transform: translateX(4px); background: rgba(255,255,255,1); }
.opt-btn.selected { border-color: var(--magic); }
.opt-btn.selected::before { opacity: 1; }
.opt-btn.selected span { color: #1a1040; font-weight: 700; }

/* ── 결과 ── */
#screen-result { display: none; padding-top: 40px; }

.result-img-wrap {
  display: flex; flex-direction: column; align-items: center;
  margin-bottom: 4px;
}
.char-avatar {
  width: 160px; height: 160px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(168,85,247,0.3));
  border: 3px solid rgba(180,143,255,0.5);
  box-shadow: 0 0 40px rgba(124,58,237,0.5);
  display: flex; align-items: center; justify-content: center;
  font-size: 72px;
  margin-bottom: 16px;
  animation: float 3s ease-in-out infinite;
  position: relative;
  overflow: hidden;
}
.char-avatar img {
  width: 100%; height: 100%;
  object-fit: cover;
  border-radius: 17px;
}
.char-avatar .emoji-fallback {
  font-size: 72px;
}
.char-avatar::before {
  content: '';
  position: absolute; inset: -4px;
  border-radius: 24px;
  background: conic-gradient(from 0deg, #7c3aed, #a855f7, #ec4899, #7ee8fa, #7c3aed);
  z-index: -1;
  animation: spin 4s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.result-emoji { font-size: 72px; margin-bottom: 12px; animation: float 3s ease-in-out infinite; }
.result-card {
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 44px 28px 36px;
  box-shadow: 0 12px 60px var(--shadow);
  text-align: center;
  animation: fadeUp 0.7s ease both;
  margin-bottom: 16px;
}

.result-from {
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.15em; text-transform: uppercase;
  margin-bottom: 4px;
}
.result-name {
  font-family: 'Gaegu', cursive;
  font-size: 40px; font-weight: 700;
  background: linear-gradient(135deg, var(--magic), var(--magic2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 6px;
}
.result-subtitle {
  font-size: 15px; font-weight: 700;
  color: var(--star); margin-bottom: 22px;
}
.result-desc {
  font-size: 14px; color: #ccc;
  line-height: 1.9; text-align: left;
  background: rgba(255,255,255,0.05);
  border-radius: 16px;
  padding: 20px 22px;
  margin-bottom: 20px;
  border: 1px solid rgba(255,255,255,0.07);
}
.traits {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin-bottom: 28px;
}
.trait {
  background: rgba(180,143,255,0.15);
  border: 1px solid rgba(180,143,255,0.3);
  border-radius: 100px;
  padding: 5px 14px;
  font-size: 12px; color: var(--magic);
  font-weight: 500;
}

.result-btns { display: flex; flex-direction: column; gap: 10px; }

.btn-kakao {
  background: #FEE500; color: #3C1E1E;
  border: none; border-radius: 14px;
  padding: 16px; font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.2s, transform 0.1s;
}
.btn-kakao:hover { opacity: 0.9; transform: translateY(-1px); }

.btn-copy {
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border);
  border-radius: 14px; padding: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; color: var(--muted);
  cursor: pointer; transition: all 0.2s;
}
.btn-copy:hover { border-color: var(--magic2); color: var(--magic2); }

.btn-retry {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px; color: var(--muted);
  cursor: pointer; transition: all 0.2s;
}
.btn-retry:hover { border-color: var(--pink); color: var(--pink); }

@keyframes fadeUp {
  from { opacity:0; transform: translateY(22px); }
  to { opacity:1; transform: translateY(0); }
}

.toast {
  position: fixed; bottom: 30px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(30,15,60,0.95);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 100px;
  padding: 12px 24px; font-size: 13px;
  opacity: 0; transition: all 0.3s;
  pointer-events: none; z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- 별 파티클 -->
<div class="stars" id="stars"></div>

<div class="wrap">

<!-- 인트로 -->
<div id="screen-intro">
  <div class="intro-magic">🔮</div>
  <h1 class="intro-title">나에게 어울리는<br>캐릭터는 누구?</h1>
  <p class="intro-sub">디즈니, 지브리, 만화 속 28가지 캐릭터 중<br>나와 가장 닮은 캐릭터를 찾아드려요</p>
  <div class="char-preview">
    <span class="char-chip">🏰 디즈니</span>
    <span class="char-chip">🌿 지브리</span>
    <span class="char-chip">💥 만화/애니</span>
    <span class="char-chip">🦸 히어로</span>
    <span class="char-chip">✨ 28가지</span>
  </div>
  <button class="btn-start" onclick="startQuiz()">✨ 나의 캐릭터 찾기</button>
  <p class="intro-note">12문항 · 약 2분</p>
</div>

<!-- 문항 -->
<div id="screen-quiz">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="prog-text">1 / 12</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="question-card">
    <div class="q-num" id="q-num">Q1</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>
</div>

<!-- 결과 -->
<div id="screen-result">
  <div class="result-card">
    <div class="result-img-wrap" id="res-img-wrap">
      <div class="char-avatar" id="res-char-avatar"></div>
    </div>
    <div class="result-from" id="res-from"></div>
    <div class="result-name" id="res-name"></div>
    <div class="result-subtitle" id="res-subtitle"></div>
    <div class="result-desc" id="res-desc"></div>
    <div class="traits" id="res-traits"></div>
    <div class="result-btns">
      <button class="btn-kakao" onclick="shareKakao()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2C5.58 2 2 4.91 2 8.5c0 2.28 1.38 4.28 3.46 5.5L4.5 17.5l3.9-2.14c.52.08 1.06.14 1.6.14 4.42 0 8-2.91 8-6.5S14.42 2 10 2z" fill="#3C1E1E"/></svg>
        카카오톡으로 공유
      </button>
      <button class="btn-copy" onclick="copyLink()">🔗 링크 복사</button>
      <button class="btn-retry" onclick="retry()">🔄 다시 하기</button>
    </div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script>
// ── 별 생성 ──
(function() {
  const wrap = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --d:${2+Math.random()*4}s;
      --delay:${Math.random()*5}s;
      --op:${0.4+Math.random()*0.6};
    `;
    wrap.appendChild(s);
  }
})();

// ── 문항 ──
const QUESTIONS = [
  {
    text: "친구들 사이에서 나는 주로?",
    options: [
      { label: "분위기를 주도하고 모두를 웃게 만드는 편", scores: {용기:2, 밝음:2} },
      { label: "조용히 뒤에서 챙겨주는 든든한 존재", scores: {따뜻함:2, 신중:2} },
      { label: "엉뚱한 아이디어로 예상치 못한 방향을 제시", scores: {창의:2, 자유:2} },
      { label: "진지하게 고민하고 해결책을 찾아주는 편", scores: {지혜:2, 신중:2} }
    ]
  },
  {
    text: "힘든 상황이 닥쳤을 때 나는?",
    options: [
      { label: "무조건 부딪혀본다. 일단 해보는 거야!", scores: {용기:3, 열정:1} },
      { label: "주변 사람들과 함께 헤쳐나갈 방법을 찾는다", scores: {따뜻함:2, 신의:2} },
      { label: "혼자 조용히 생각하며 최선의 방법을 찾는다", scores: {신중:2, 지혜:2} },
      { label: "유머로 분위기를 풀고 긍정적으로 바라본다", scores: {밝음:2, 자유:2} }
    ]
  },
  {
    text: "이상적인 하루를 보낸다면?",
    options: [
      { label: "새로운 곳을 탐험하고 모험을 즐긴다", scores: {자유:2, 용기:2} },
      { label: "가까운 사람들과 따뜻한 시간을 보낸다", scores: {따뜻함:3, 신의:1} },
      { label: "책을 읽거나 새로운 걸 배우며 혼자만의 시간", scores: {지혜:2, 신중:2} },
      { label: "자연 속에서 조용히 쉬거나 예술적인 걸 만든다", scores: {감성:3, 자유:1} }
    ]
  },
  {
    text: "나의 가장 큰 강점은?",
    options: [
      { label: "어떤 상황에서도 포기하지 않는 의지력", scores: {용기:3, 열정:1} },
      { label: "상대의 마음을 잘 읽고 공감하는 능력", scores: {따뜻함:2, 감성:2} },
      { label: "번뜩이는 아이디어와 창의적인 사고", scores: {창의:3, 자유:1} },
      { label: "냉정하게 상황을 분석하고 판단하는 능력", scores: {지혜:3, 신중:1} }
    ]
  },
  {
    text: "나를 가장 화나게 하는 것은?",
    options: [
      { label: "불공평한 일이 일어날 때", scores: {용기:2, 신의:2} },
      { label: "소중한 사람이 상처받을 때", scores: {따뜻함:3, 신의:1} },
      { label: "자유를 억압당하거나 규칙에 갇힐 때", scores: {자유:3, 열정:1} },
      { label: "노력이 인정받지 못할 때", scores: {열정:2, 신중:2} }
    ]
  },
  {
    text: "꿈꾸는 나의 모습은?",
    options: [
      { label: "세상을 구하거나 큰 변화를 만드는 영웅", scores: {용기:3, 열정:1} },
      { label: "모두가 행복하게 살 수 있는 세상을 만드는 사람", scores: {따뜻함:2, 지혜:2} },
      { label: "자유롭게 세계를 누비며 나만의 길을 걷는 사람", scores: {자유:3, 창의:1} },
      { label: "깊은 지식과 지혜로 주변을 이끄는 사람", scores: {지혜:3, 신중:1} }
    ]
  },
  {
    text: "나의 단점을 하나 고른다면?",
    options: [
      { label: "너무 충동적이고 생각보다 행동이 앞선다", scores: {용기:2, 열정:2} },
      { label: "남의 눈치를 너무 많이 본다", scores: {따뜻함:2, 신중:2} },
      { label: "한번 꽂히면 집착하는 편이다", scores: {열정:2, 창의:2} },
      { label: "혼자만의 세계에 빠져 소통이 부족할 때가 있다", scores: {지혜:1, 감성:3} }
    ]
  },
  {
    text: "갑자기 마법 능력이 생긴다면?",
    options: [
      { label: "무한한 힘! 어떤 적도 무찌를 수 있는 파워", scores: {용기:3, 열정:1} },
      { label: "치유 마법 - 아픈 사람을 모두 낫게 해주고 싶어", scores: {따뜻함:3, 감성:1} },
      { label: "시간 이동! 과거와 미래를 자유롭게 오가고 싶어", scores: {지혜:2, 자유:2} },
      { label: "무엇이든 만들어내는 창조 마법", scores: {창의:3, 자유:1} }
    ]
  },
  {
    text: "낯선 사람을 처음 만났을 때 나는?",
    options: [
      { label: "먼저 말 걸고 금방 친해지는 편", scores: {밝음:3, 열정:1} },
      { label: "천천히 지켜보다가 신뢰가 생기면 마음을 연다", scores: {신중:2, 신의:2} },
      { label: "상대가 어떤 사람인지 관찰하고 파악하려 한다", scores: {지혜:2, 신중:2} },
      { label: "상대방의 감정과 분위기를 먼저 읽는다", scores: {감성:3, 따뜻함:1} }
    ]
  },
  {
    text: "나에게 가장 소중한 것은?",

  { name: "피카츄", from: "⚡ 포켓몬 (닌텐도)", emoji: "⚡", subtitle: "전기처럼 통하는 우리 사이", desc: "말보다 행동과 표정으로 감정을 전달하는 타입. 에너지가 넘치고 곁에 있으면 기분이 좋아지는 존재예요. 처음엔 낯가리지만 친해지면 완전 애교쟁이예요.", traits: ["에너지 넘치는", "애교 있는", "충직한", "밝은"], image: "https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/International_Pok%C3%A9mon_logo.svg/300px-International_Pok%C3%A9mon_logo.svg.png", primary: "밝음", secondary: "신의" },
  { name: "도리", from: "🐠 니모를 찾아서 (픽사)", emoji: "🐠", subtitle: "Just keep swimming!", desc: "잊어버리기 일쑤지만 항상 밝게 나아가는 긍정왕. 어떤 상황도 유쾌하게 받아들이고 처음 만난 사람도 금세 친구로 만드는 재주가 있어요. 순간에 충실한 삶을 살아요.", traits: ["긍정왕", "사교적", "순간 충실", "유쾌한"], image: "https://upload.wikimedia.org/wikipedia/en/2/25/Finding_Dory.png", primary: "밝음", secondary: "자유" }
];

// ── 상태 ──
let current = 0;
let scores = { 용기:0, 따뜻함:0, 지혜:0, 자유:0, 창의:0, 감성:0, 신의:0, 밝음:0, 열정:0, 신중:0 };

function startQuiz() {
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const pct = Math.round((current / QUESTIONS.length) * 100);

  document.getElementById('prog-text').textContent = `${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-text').textContent = q.text;

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = q.options.map((o, i) =>
    `<button class="opt-btn" onclick="answer(${i})"><span>${o.label}</span></button>`
  ).join('');

  const card = document.querySelector('.question-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.4s ease both'; });
}

function answer(idx) {
  const q = QUESTIONS[current];
  const chosen = q.options[idx];
  Object.entries(chosen.scores).forEach(([k, v]) => { scores[k] = (scores[k] || 0) + v; });

  const btns = document.querySelectorAll('.opt-btn');
  btns[idx].classList.add('selected');

  setTimeout(() => {
    current++;
    if (current < QUESTIONS.length) renderQuestion();
    else showResult();
  }, 350);
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  // 상위 두 속성 찾기
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const top1 = sorted[0][0];
  const top2 = sorted[1][0];

  // 가장 잘 맞는 캐릭터 찾기
  let best = CHARACTERS.find(c => c.primary === top1 && c.secondary === top2)
          || CHARACTERS.find(c => c.primary === top1 && c.secondary === sorted[2][0])
          || CHARACTERS.find(c => c.primary === top1)
          || CHARACTERS[0];

  const avatarEl = document.getElementById('res-char-avatar');
  if (best.image) {
    avatarEl.innerHTML = `<img src="${best.image}" alt="${best.name}" onerror="this.style.display='none';this.nextSibling.style.display='flex'"><span class="emoji-fallback" style="display:none">${best.emoji}</span>`;
  } else {
    avatarEl.innerHTML = `<span class="emoji-fallback">${best.emoji}</span>`;
  }
  document.getElementById('res-from').textContent = best.from;
  document.getElementById('res-name').textContent = best.name;
  document.getElementById('res-subtitle').textContent = `"${best.subtitle}"`;
  document.getElementById('res-desc').textContent = best.desc;
  document.getElementById('res-traits').innerHTML = best.traits.map(t => `<span class="trait">${t}</span>`).join('');

  window._result = best;
}

function shareKakao() {
  const r = window._result;
  if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: 'text',
      text: `✨ 나에게 어울리는 캐릭터는?\n\n${r.emoji} ${r.name} (${r.from})\n"${r.subtitle}"\n\n나도 해봐!`,
      link: { mobileWebUrl: window.location.href, webUrl: window.location.href }
    });
  } else {
    copyLink();
    showToast('카카오 SDK 설정이 필요해요. 링크를 복사했어요! 🔗');
  }
}

function copyLink() {
  const r = window._result;
  const text = `✨ 내 캐릭터는 ${r.name}!\n${window.location.href}`;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showToast('링크 복사됐어요! 친구에게 공유해봐요 ✨'))
      .catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(el);
  el.focus(); el.select();
  try {
    document.execCommand('copy');
    showToast('링크 복사됐어요! 친구에게 공유해봐요 ✨');
  } catch(e) {
    showToast('직접 URL을 복사해주세요 ㅠㅠ');
  }
  document.body.removeChild(el);
}

function retry() {
  current = 0;
  scores = { 용기:0, 따뜻함:0, 지혜:0, 자유:0, 창의:0, 감성:0, 신의:0, 밝음:0, 열정:0, 신중:0 };
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-intro').style.display = 'flex';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
