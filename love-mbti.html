<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="💘 나의 연애 MBTI는?">
<meta property="og:description" content="12가지 질문으로 알아보는 나의 연애 스타일">
<title>💘 연애 MBTI 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --rose: #e8637a;
  --rose-light: #f2a0b0;
  --rose-dark: #c44060;
  --cream: #fdf6f0;
  --warm: #f5e6d8;
  --text: #2d1f26;
  --muted: #9a7d88;
  --card: #fffaf7;
  --shadow: rgba(232,99,122,0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--cream);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* 배경 장식 */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 20% 0%, rgba(232,99,122,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 80%, rgba(242,160,176,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 30% 30% at 60% 40%, rgba(245,230,216,0.4) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 20px 60px;
  position: relative;
  z-index: 1;
}

/* ── 인트로 ── */
#screen-intro {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  text-align: center;
  animation: fadeUp 0.8s ease both;
}

.intro-deco {
  font-size: 56px;
  margin-bottom: 20px;
  animation: heartbeat 2s ease infinite;
}

@keyframes heartbeat {
  0%,100% { transform: scale(1); }
  30% { transform: scale(1.15); }
  60% { transform: scale(1.05); }
}

.intro-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 7vw, 48px);
  font-weight: 700;
  line-height: 1.2;
  color: var(--text);
  margin-bottom: 8px;
}

.intro-title em {
  font-style: italic;
  color: var(--rose);
}

.intro-sub {
  font-size: 15px;
  color: var(--muted);
  font-weight: 300;
  line-height: 1.7;
  margin-bottom: 40px;
  max-width: 340px;
}

.btn-start {
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  color: #fff;
  border: none;
  border-radius: 100px;
  padding: 18px 52px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 32px var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  letter-spacing: 0.05em;
}

.btn-start:hover { transform: translateY(-2px); box-shadow: 0 12px 40px var(--shadow); }
.btn-start:active { transform: translateY(0); }

.intro-count {
  margin-top: 20px;
  font-size: 12px;
  color: var(--muted);
  letter-spacing: 0.1em;
}

/* ── 문항 ── */
#screen-quiz { display: none; padding-top: 40px; }

.progress-wrap {
  margin-bottom: 32px;
  animation: fadeUp 0.5s ease both;
}

.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 8px;
  letter-spacing: 0.05em;
}

.progress-bar {
  height: 4px;
  background: var(--warm);
  border-radius: 100px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--rose-light), var(--rose));
  border-radius: 100px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.question-card {
  background: var(--card);
  border-radius: 24px;
  padding: 36px 32px 32px;
  box-shadow: 0 4px 40px var(--shadow);
  margin-bottom: 20px;
  animation: fadeUp 0.5s ease both;
}

.q-num {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 13px;
  color: var(--rose-light);
  margin-bottom: 16px;
  letter-spacing: 0.05em;
}

.q-text {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 28px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.opt-btn {
  background: var(--cream);
  border: 1.5px solid rgba(232,99,122,0.2);
  border-radius: 14px;
  padding: 16px 20px;
  text-align: left;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--text);
  cursor: pointer;
  transition: all 0.2s;
  line-height: 1.5;
  position: relative;
  overflow: hidden;
}

.opt-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, var(--rose), var(--rose-dark));
  opacity: 0;
  transition: opacity 0.2s;
}

.opt-btn span { position: relative; z-index: 1; }

.opt-btn:hover {
  border-color: var(--rose);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--shadow);
}

.opt-btn.selected {
  border-color: var(--rose);
  color: #fff;
}

.opt-btn.selected::before { opacity: 1; }

/* ── 결과 ── */
#screen-result { display: none; padding-top: 40px; }

.result-card {
  background: var(--card);
  border-radius: 28px;
  padding: 44px 32px 36px;
  box-shadow: 0 8px 60px var(--shadow);
  text-align: center;
  animation: fadeUp 0.7s ease both;
  margin-bottom: 20px;
}

.result-emoji { font-size: 64px; margin-bottom: 16px; }

.result-type {
  font-family: 'Playfair Display', serif;
  font-size: 52px;
  font-weight: 700;
  color: var(--rose);
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}

.result-nickname {
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
}

.result-desc {
  font-size: 14px;
  color: #5a4a50;
  line-height: 1.85;
  text-align: left;
  background: var(--warm);
  border-radius: 16px;
  padding: 20px 22px;
  margin-bottom: 24px;
}

.traits {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 28px;
}

.trait {
  background: rgba(232,99,122,0.1);
  border: 1px solid rgba(232,99,122,0.25);
  border-radius: 100px;
  padding: 6px 14px;
  font-size: 12px;
  color: var(--rose-dark);
  font-weight: 500;
}

.result-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-kakao {
  background: #FEE500;
  color: #3C1E1E;
  border: none;
  border-radius: 14px;
  padding: 16px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-kakao:hover { opacity: 0.9; transform: translateY(-1px); }

.btn-retry {
  background: transparent;
  border: 1.5px solid rgba(232,99,122,0.3);
  border-radius: 14px;
  padding: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}

.btn-retry:hover { border-color: var(--rose); color: var(--rose); }

/* 링크 복사 버튼 */
.btn-copy {
  background: var(--warm);
  border: none;
  border-radius: 14px;
  padding: 15px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.2s;
}
.btn-copy:hover { background: rgba(232,99,122,0.1); color: var(--rose); }

/* ── 공통 애니메이션 ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* toast */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: #fff;
  border-radius: 100px;
  padding: 12px 24px;
  font-size: 13px;
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">

<!-- 인트로 -->
<div id="screen-intro">
  <div class="intro-deco">💘</div>
  <h1 class="intro-title">나의 연애 스타일<br><em>MBTI</em>는?</h1>
  <p class="intro-sub">12가지 질문으로 알아보는<br>내가 사랑할 때의 진짜 모습</p>
  <button class="btn-start" onclick="startQuiz()">테스트 시작하기</button>
  <p class="intro-count">✦ 12문항 · 약 3분 소요</p>
</div>

<!-- 문항 -->
<div id="screen-quiz">
  <div class="progress-wrap">
    <div class="progress-label">
      <span id="prog-text">1 / 12</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
  </div>
  <div class="question-card">
    <div class="q-num" id="q-num">Q1</div>
    <div class="q-text" id="q-text"></div>
    <div class="options" id="options"></div>
  </div>
</div>

<!-- 결과 -->
<div id="screen-result">
  <div class="result-card">
    <div class="result-emoji" id="res-emoji"></div>
    <div class="result-type" id="res-type"></div>
    <div class="result-nickname" id="res-nickname"></div>
    <div class="result-desc" id="res-desc"></div>
    <div class="traits" id="res-traits"></div>
    <div class="result-btns">
      <button class="btn-kakao" onclick="shareKakao()">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2C5.58 2 2 4.91 2 8.5c0 2.28 1.38 4.28 3.46 5.5L4.5 17.5l3.9-2.14c.52.08 1.06.14 1.6.14 4.42 0 8-2.91 8-6.5S14.42 2 10 2z" fill="#3C1E1E"/></svg>
        카카오톡으로 공유
      </button>
      <button class="btn-copy" onclick="copyLink()">🔗 링크 복사</button>
      <button class="btn-retry" onclick="retry()">🔄 다시 하기</button>
    </div>
  </div>
</div>

</div>
<div class="toast" id="toast"></div>

<script src="https://developers.kakao.com/sdk/js/kakao.min.js"></script>
<script>
// ── 문항 데이터 ──
const QUESTIONS = [
  // E/I (1,2,3)
  {
    text: "오래 사귄 연인과의 주말 계획, 나는?",
    a: { label: "친구들이랑 같이 놀러가자고 제안한다", axis: "E" },
    b: { label: "둘이서만 조용히 집에서 쉬고 싶다", axis: "I" }
  },
  {
    text: "연애 중 힘든 일이 생겼을 때 나는?",
    a: { label: "연인이나 친구에게 바로 털어놓고 이야기한다", axis: "E" },
    b: { label: "혼자 조용히 생각하며 정리하고 나서 말한다", axis: "I" }
  },
  {
    text: "처음 좋아하는 사람이 생기면?",
    a: { label: "티 나도 좋으니 적극적으로 어필한다", axis: "E" },
    b: { label: "티 안 내고 속으로만 오래 담아둔다", axis: "I" }
  },
  // N/S (4,5,6)
  {
    text: "연인과 미래 이야기를 할 때 나는?",
    a: { label: "\"우리 나중에 이런 삶 살면 어떨까~\" 상상을 펼친다", axis: "N" },
    b: { label: "\"지금 우리 상황에서 현실적으로 가능한 게 뭔지\" 따져본다", axis: "S" }
  },
  {
    text: "연인에게 애정을 표현할 때 주로?",
    a: { label: "편지나 말로 감정과 의미를 풍부하게 표현한다", axis: "N" },
    b: { label: "밥 챙겨주고, 필요한 걸 해주는 행동으로 보여준다", axis: "S" }
  },
  {
    text: "연애에서 더 중요하게 생각하는 건?",
    a: { label: "우리 관계의 의미와 깊이 있는 연결감", axis: "N" },
    b: { label: "함께하는 일상의 안정감과 믿음직함", axis: "S" }
  },
  // T/F (7,8,9)
  {
    text: "연인이 많이 속상해서 하소연할 때 나는?",
    a: { label: "원인을 파악하고 해결책을 먼저 제시한다", axis: "T" },
    b: { label: "\"많이 힘들었겠다\" 공감부터 충분히 해준다", axis: "F" }
  },
  {
    text: "연인과 의견이 충돌하면?",
    a: { label: "논리적으로 왜 내 생각이 맞는지 차분히 설명한다", axis: "T" },
    b: { label: "상대 기분이 상할까봐 먼저 배려하며 조율한다", axis: "F" }
  },
  {
    text: "헤어진 후 나의 모습은?",
    a: { label: "왜 안 됐는지 이유를 분석하며 빨리 털어낸다", axis: "T" },
    b: { label: "감정이 가라앉는 데 시간이 오래 걸린다", axis: "F" }
  },
  // J/P (10,11,12)
  {
    text: "연인과 여행을 간다면?",
    a: { label: "일정, 숙소, 식당 모두 미리 꼼꼼히 짜놓는다", axis: "J" },
    b: { label: "큰 그림만 잡고 그날그날 즉흥적으로 다닌다", axis: "P" }
  },
  {
    text: "연락 스타일은?",
    a: { label: "연락 주기와 패턴이 어느 정도 정해져 있는 게 좋다", axis: "J" },
    b: { label: "생각날 때 하고 싶을 때 자유롭게 연락하는 게 좋다", axis: "P" }
  },
  {
    text: "연애할 때 나를 가장 잘 표현하는 말은?",
    a: { label: "\"약속은 반드시 지킨다, 믿음직한 사람\"", axis: "J" },
    b: { label: "\"매일 새로운 매력이 있는 자유로운 사람\"", axis: "P" }
  }
];

// ── MBTI 결과 데이터 ──
const RESULTS = {
  ENFJ: { emoji: "🌹", nickname: "로맨틱 리더형", desc: "연애에서 상대를 세상에서 가장 소중한 사람처럼 대해요. 표현이 풍부하고 관계에 온 마음을 쏟는 타입. 가끔 너무 많이 줘서 지칠 때도 있지만, 함께하는 모든 순간을 특별하게 만드는 매력이 있어요.", traits: ["표현력 MAX", "배려쟁이", "관계 주도형", "감성적"] },
  ENFP: { emoji: "🦋", nickname: "설레임 제조기형", desc: "좋아하는 사람 앞에서 눈이 반짝반짝해지는 타입. 매 순간 새로운 설렘을 만들어내고 상대를 웃게 하는 재주가 있어요. 자유롭고 감성적이지만 진심은 누구보다 깊어요.", traits: ["설렘 장인", "자유로운 영혼", "감성 폭발", "밝은 에너지"] },
  ENTJ: { emoji: "👑", nickname: "연애도 전략적으로형", desc: "좋아하면 확실하게 어필하고 관계를 이끌어가는 리더형 연인. 감정 표현이 서툴러 보여도 속으로는 상대를 깊이 아끼고 있어요. 든든하고 믿음직한 파트너예요.", traits: ["추진력 있는", "든든한 리더", "목표 지향", "카리스마"] },
  ENTP: { emoji: "🎯", nickname: "지적 설렘 유발형", desc: "대화로 상대의 마음을 사로잡는 타입. 예상치 못한 말로 설레게 하고 논쟁도 재미있게 만들어요. 자유로운 연애를 선호하지만 한번 진심이 되면 엄청난 열정을 보여줘요.", traits: ["대화 고수", "위트 있는", "자유로운", "지적 매력"] },
  INFJ: { emoji: "🌙", nickname: "깊은 감성 연결형", desc: "표면보다 내면의 연결을 중요하게 여기는 타입. 말보다 눈빛으로 더 많이 소통하고, 상대의 감정을 누구보다 잘 읽어요. 한 번 마음을 열면 세상 둘도 없는 연인이 돼요.", traits: ["감성 깊은", "직관적인", "헌신적인", "신중한"] },
  INFP: { emoji: "🌸", nickname: "순수 감성 낭만형", desc: "연애를 한 편의 시처럼 느끼는 타입. 사소한 순간에도 감동받고, 상대를 진심으로 이해하려고 노력해요. 겉은 수줍어 보여도 속에는 엄청난 감정의 파도가 있어요.", traits: ["순수한", "낭만적인", "감수성 풍부", "공감 능력자"] },
  INTJ: { emoji: "🔮", nickname: "신비로운 깊이형", desc: "쉽게 마음을 열지 않지만 한번 열면 전부 주는 타입. 감정 표현은 서툴러도 행동으로 사랑을 증명해요. 독립적이면서도 연인을 깊이 신뢰하는 진지한 연애를 해요.", traits: ["신중한", "독립적인", "진지한 연애", "깊은 신뢰"] },
  INTP: { emoji: "🧩", nickname: "독특한 매력 지식형", desc: "연애도 탐구의 대상! 상대를 분석하고 이해하려는 노력이 독특한 매력이에요. 감정 표현이 어색할 때도 있지만 상대를 진심으로 존중하고 아껴요.", traits: ["분석적인", "독창적인", "솔직한", "독립적"] },
  ESFJ: { emoji: "🏡", nickname: "따뜻한 일상 챙김형", desc: "연인의 밥은 먹었는지, 오늘 기분은 어떤지 늘 먼저 챙기는 타입. 안정적이고 따뜻한 일상을 함께 만들어가는 걸 사랑해요. 곁에 있으면 항상 든든한 연인이에요.", traits: ["세심한 챙김", "안정 추구", "헌신적인", "따뜻한"] },
  ESFP: { emoji: "🎉", nickname: "함께라면 매일 축제형", desc: "함께 있으면 매일이 즐거워지는 타입. 즉흥적이고 유쾌해서 지루한 순간이 없어요. 표현이 화끈하고 애정 표현을 아끼지 않아서 상대를 항상 기분 좋게 해줘요.", traits: ["활기찬", "즉흥적인", "표현 직접적", "분위기 메이커"] },
  ESTJ: { emoji: "🛡️", nickname: "믿음직한 현실파형", desc: "말보다 행동으로 사랑을 보여주는 타입. 계획적이고 책임감이 강해서 연인에게 항상 든든한 존재예요. 감정 표현은 조금 서툴러도 진심은 행동에서 다 보여요.", traits: ["책임감 강한", "현실적인", "든든한", "행동파"] },
  ESTP: { emoji: "⚡", nickname: "짜릿한 순간 충실형", desc: "지금 이 순간을 최고로 만드는 타입. 대담하고 솔직해서 좋아하면 바로 티가 나요. 매너 있고 재미있어서 함께 있으면 시간 가는 줄 모르는 연인이에요.", traits: ["대담한", "솔직한", "현재 충실", "매력적인"] },
  ISFJ: { emoji: "🕯️", nickname: "조용한 헌신 사랑형", desc: "티 안 나게 늘 곁에서 챙겨주는 타입. 연인이 좋아하는 것, 싫어하는 것을 다 기억하고 세심하게 배려해요. 잔잔하지만 깊고, 조용하지만 진심인 사랑을 해요.", traits: ["세심한", "기억력 좋은", "조용한 헌신", "따뜻한"] },
  ISFP: { emoji: "🎨", nickname: "감성 표현 아티스트형", desc: "말보다 분위기와 행동으로 감정을 전달하는 타입. 자유롭고 감성적이며 연인에게 아름다운 순간들을 선물해요. 겉은 조용해 보여도 속에는 따뜻한 애정이 넘쳐요.", traits: ["감성적인", "자유로운", "섬세한", "예술적 감각"] },
  ISTJ: { emoji: "⚓", nickname: "변함없는 신뢰 기반형", desc: "한번 마음을 주면 끝까지 변함없는 타입. 약속을 소중히 여기고 믿음을 가장 중요하게 생각해요. 화려하지 않아도 늘 그 자리에 있어주는 가장 든든한 연인이에요.", traits: ["신뢰의 아이콘", "약속 중시", "꾸준한", "성실한"] },
  ISTP: { emoji: "🔧", nickname: "차갑지만 은근 챙김형", desc: "겉은 쿨하고 덤덤해 보여도 속으로는 연인을 깊이 아끼는 타입. 말보다 행동으로, 화려함보다 실질적인 도움으로 사랑을 표현해요. 의외의 다정함에 반하게 되는 스타일이에요.", traits: ["쿨한 매력", "실용적인", "독립적인", "은근 다정"] }
};

// ── 상태 ──
let current = 0;
let scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };

function startQuiz() {
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-quiz').style.display = 'block';
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[current];
  const pct = Math.round((current / QUESTIONS.length) * 100);

  document.getElementById('prog-text').textContent = `${current + 1} / ${QUESTIONS.length}`;
  document.getElementById('prog-pct').textContent = `${pct}%`;
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('q-num').textContent = `Q${current + 1}`;
  document.getElementById('q-text').textContent = q.text;

  const optWrap = document.getElementById('options');
  optWrap.innerHTML = `
    <button class="opt-btn" onclick="answer('a')"><span>${q.a.label}</span></button>
    <button class="opt-btn" onclick="answer('b')"><span>${q.b.label}</span></button>
  `;

  // 애니메이션 리셋
  const card = document.querySelector('.question-card');
  card.style.animation = 'none';
  requestAnimationFrame(() => { card.style.animation = 'fadeUp 0.4s ease both'; });
}

function answer(choice) {
  const q = QUESTIONS[current];
  const axis = q[choice].axis;
  scores[axis]++;

  // 선택 시각 피드백
  const btns = document.querySelectorAll('.opt-btn');
  const idx = choice === 'a' ? 0 : 1;
  btns[idx].classList.add('selected');

  setTimeout(() => {
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 350);
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  const type =
    (scores.E >= scores.I ? 'E' : 'I') +
    (scores.N >= scores.S ? 'N' : 'S') +
    (scores.T >= scores.F ? 'T' : 'F') +
    (scores.J >= scores.P ? 'J' : 'P');

  const r = RESULTS[type];
  document.getElementById('res-emoji').textContent = r.emoji;
  document.getElementById('res-type').textContent = type;
  document.getElementById('res-nickname').textContent = r.nickname;
  document.getElementById('res-desc').textContent = r.desc;
  document.getElementById('res-traits').innerHTML = r.traits.map(t => `<span class="trait">${t}</span>`).join('');

  window._resultType = type;
  window._resultData = r;
}

function shareKakao() {
  const type = window._resultType;
  const r = window._resultData;

  if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
    Kakao.Share.sendDefault({
      objectType: 'text',
      text: `💘 나의 연애 MBTI 결과\n\n${r.emoji} ${type} - ${r.nickname}\n\n${r.desc.slice(0, 60)}...\n\n나도 테스트 해봐!`,
      link: { mobileWebUrl: window.location.href, webUrl: window.location.href }
    });
  } else {
    // SDK 미초기화 시 링크 복사로 대체
    copyLink();
    showToast('카카오 SDK 설정이 필요해요. 링크를 복사했어요! 🔗');
  }
}

function copyLink() {
  const type = window._resultType;
  const r = window._resultData;
  const text = `💘 나의 연애 MBTI: ${type} ${r.nickname}
${window.location.href}`;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('링크가 복사됐어요! 친구에게 공유해보세요 💌');
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
  document.body.appendChild(el);
  el.focus();
  el.select();
  try {
    document.execCommand('copy');
    showToast('링크가 복사됐어요! 친구에게 공유해보세요 💌');
  } catch (e) {
    showToast('복사에 실패했어요 ㅠㅠ 직접 URL을 복사해주세요!');
  }
  document.body.removeChild(el);
}

function _deleted_() {
  const type = window._resultType;
  const r = window._resultData;
  const text = `💘 나의 연애 MBTI: ${type} ${r.nickname}\n${window.location.href}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast('링크가 복사됐어요! 친구에게 공유해보세요 💌');
  }).catch(() => {
    showToast('복사에 실패했어요 ㅠㅠ');
  });
}

function retry() {
  current = 0;
  scores = { E: 0, I: 0, N: 0, S: 0, T: 0, F: 0, J: 0, P: 0 };
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-intro').style.display = 'flex';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
