<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏡 나에게 맞는 집터 풍수 분석</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#fffdf8; --gold:#9a6e1a; --gold-light:#7a5010;
  --jade:#2a8a5a; --text:#2a1f0e; --muted:#9a8a6a;
  --border:rgba(154,110,26,0.18); --shadow:rgba(154,110,26,0.08);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(201,168,76,0.07) 0%,transparent 60%),radial-gradient(ellipse 30% 30% at 10% 80%,rgba(45,106,79,0.05) 0%,transparent 50%);pointer-events:none;z-index:0;}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 80px;position:relative;z-index:1;}
#screen-intro{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;animation:fadeUp 0.8s ease both;}
.intro-symbol{font-size:56px;margin-bottom:20px;animation:spin 20s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.intro-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(24px,5vw,38px);font-weight:800;line-height:1.4;margin-bottom:10px;color:var(--gold-light);}
.intro-divider{width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:14px auto;}
.intro-sub{font-size:14px;color:var(--muted);line-height:1.9;margin-bottom:32px;font-weight:300;max-width:380px;}
.ohang-row{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap;justify-content:center;}
.chip{padding:5px 14px;border-radius:4px;font-size:12px;font-weight:600;}
.mok{background:rgba(45,106,79,0.1);border:1px solid rgba(45,106,79,0.3);color:#2a8a5a;}
.hwa{background:rgba(192,57,43,0.1);border:1px solid rgba(192,57,43,0.3);color:#c0392b;}
.to{background:rgba(154,110,26,0.1);border:1px solid rgba(154,110,26,0.3);color:#9a6e1a;}
.gum{background:rgba(100,100,110,0.1);border:1px solid rgba(100,100,110,0.3);color:#606070;}
.su{background:rgba(26,74,122,0.1);border:1px solid rgba(26,74,122,0.3);color:#1a4a7a;}
.form-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:28px 24px;width:100%;max-width:460px;box-shadow:0 8px 40px var(--shadow);}
.flabel{font-family:'Nanum Myeongjo',serif;font-size:12px;color:var(--gold);letter-spacing:0.14em;margin-bottom:8px;display:block;font-weight:700;}
.toggle{display:flex;margin-bottom:16px;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.tbtn{flex:1;padding:10px;background:#faf8f4;border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--muted);font-weight:500;transition:all 0.2s;}
.tbtn.on{background:var(--gold);color:#fff;font-weight:700;}
.tbtn:first-child{border-right:1px solid var(--border);}
.lunar-note{display:none;background:rgba(154,110,26,0.06);border:1px solid rgba(154,110,26,0.15);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.finput,.fsel{background:#faf8f4;border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;width:100%;}
.finput::placeholder{color:var(--muted);}
.finput:focus,.fsel:focus{border-color:var(--gold);}
.fsel{cursor:pointer;-webkit-appearance:none;}
.fsel option{background:#fff;color:var(--text);}
.fhint{font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.btn-go{width:100%;background:linear-gradient(135deg,#8b6f3e,var(--gold),#8b6f3e);background-size:200% 100%;color:#fff;border:none;border-radius:10px;padding:16px;font-family:'Nanum Myeongjo',serif;font-size:17px;font-weight:800;cursor:pointer;letter-spacing:0.1em;transition:background-position 0.4s,transform 0.1s;box-shadow:0 4px 20px rgba(154,110,26,0.25);}
.btn-go:hover{background-position:100% 0;transform:translateY(-2px);}
.loading{display:none;text-align:center;padding:80px 20px;}
.loading-symbol{font-size:52px;animation:spin 3s linear infinite;display:inline-block;margin-bottom:16px;}
.loading-text{font-family:'Nanum Myeongjo',serif;font-size:15px;color:var(--muted);letter-spacing:0.1em;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:0.5;}50%{opacity:1;}}
#screen-result{display:none;padding-top:48px;}
.rhead{text-align:center;margin-bottom:28px;animation:fadeUp 0.6s ease both;}
.rsaju{font-family:'Nanum Myeongjo',serif;font-size:12px;color:var(--muted);letter-spacing:0.12em;margin-bottom:8px;}
.rtitle{font-family:'Nanum Myeongjo',serif;font-size:clamp(20px,4vw,30px);font-weight:800;color:var(--gold-light);margin-bottom:6px;line-height:1.4;}
.rbadge{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:100px;border:1px solid var(--border);font-size:13px;font-weight:600;background:#fff;margin-top:6px;}
.sec{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px;margin-bottom:12px;animation:fadeUp 0.5s ease both;box-shadow:0 2px 16px var(--shadow);}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.sicon{font-size:20px;}
.stitle{font-family:'Nanum Myeongjo',serif;font-size:15px;font-weight:700;color:var(--gold-light);}
.sdiv{width:100%;height:1px;background:linear-gradient(90deg,var(--border),transparent);margin-bottom:12px;}
.compass-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.compass{width:130px;height:130px;border-radius:50%;border:2px solid var(--border);position:relative;flex-shrink:0;background:radial-gradient(circle,rgba(201,168,76,0.06),#fdf9f0);}
.cd{position:absolute;font-size:10px;font-weight:800;color:var(--muted);}
.cdn{top:7px;left:50%;transform:translateX(-50%);}
.cds{bottom:7px;left:50%;transform:translateX(-50%);}
.cde{right:7px;top:50%;transform:translateY(-50%);}
.cdw{left:7px;top:50%;transform:translateY(-50%);}
.carrow{position:absolute;top:50%;left:50%;transform-origin:bottom center;width:3px;height:42px;margin-left:-1.5px;margin-top:-42px;border-radius:3px;}
.cctr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:var(--gold);border-radius:50%;}
.dinfo{flex:1;min-width:150px;}
.drow{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px;}
.ddot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px;}
.ddot-g{background:#2a8a5a;box-shadow:0 0 5px #2a8a5a;}
.ddot-b{background:#e74c3c;}
.dtxt{font-size:12px;line-height:1.6;}
.dtxt strong{color:var(--text);font-weight:700;display:block;}
.dtxt span{color:var(--muted);font-size:11px;}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.rcard{background:#faf8f4;border-radius:10px;padding:12px;}
.rcard-g{border:1px solid rgba(42,138,90,0.2);}
.rcard-b{border:1px solid rgba(231,76,60,0.2);}
.rlabel{font-size:11px;letter-spacing:0.1em;margin-bottom:7px;font-weight:700;}
.rlabel-g{color:#2a8a5a;}
.rlabel-b{color:#e74c3c;}
.ritems{display:flex;flex-wrap:wrap;gap:5px;}
.rtag{font-size:11px;padding:3px 9px;border-radius:4px;font-weight:500;}
.rtag-g{background:rgba(42,138,90,0.1);color:#2a8a5a;}
.rtag-b{background:rgba(231,76,60,0.08);color:#e74c3c;}
.elist{display:flex;flex-direction:column;gap:10px;}
.eitem{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:#faf8f4;border-radius:10px;border:1px solid var(--border);}
.eico{font-size:20px;flex-shrink:0;}
.etit{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.edsc{font-size:12px;color:var(--muted);line-height:1.6;}
.clist{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.citem{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:#faf8f4;border-radius:10px;border:1px solid var(--border);}
.cflag{font-size:24px;flex-shrink:0;}
.cname{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px;}
.creason{font-size:12px;color:var(--muted);line-height:1.6;}
.cgrid{display:flex;flex-wrap:wrap;gap:8px;}
.ccard{background:#faf8f4;border:1px solid var(--border);border-radius:10px;padding:10px 13px;flex:1;min-width:130px;}
.ccname{font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
.ccreason{font-size:11px;color:var(--muted);line-height:1.5;}
.colrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.colchip{display:flex;align-items:center;gap:8px;background:#faf8f4;border:1px solid var(--border);border-radius:8px;padding:8px 12px;}
.coldot{width:16px;height:16px;border-radius:50%;flex-shrink:0;border:1px solid rgba(0,0,0,0.08);}
.colname{font-size:12px;font-weight:600;color:var(--text);}
.colmean{font-size:10px;color:var(--muted);}
.mtags{display:flex;flex-wrap:wrap;gap:6px;}
.mtag{background:rgba(154,110,26,0.08);border:1px solid rgba(154,110,26,0.18);border-radius:6px;padding:4px 11px;font-size:11px;color:var(--gold);font-weight:600;}
.mtag-bad{background:rgba(231,76,60,0.06);border-color:rgba(231,76,60,0.18);color:#e74c3c;}
.slabel{font-size:12px;color:var(--muted);display:block;margin-bottom:8px;}
.gender-box{background:#faf8f4;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.gender-dir{font-size:15px;font-weight:700;margin-bottom:6px;}
.gender-note{font-size:13px;color:var(--text);line-height:1.7;}
.g2grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.g2card{background:#faf8f4;border-radius:10px;padding:12px;}
.g2card-g{border:1px solid rgba(42,138,90,0.2);}
.g2card-b{border:1px solid rgba(231,76,60,0.2);}
.g2label{font-size:11px;font-weight:700;margin-bottom:6px;}
.g2label-g{color:#2a8a5a;}
.g2label-b{color:#e74c3c;}
.g2val{font-size:12px;color:var(--text);line-height:1.5;}
.disclaimer{text-align:center;font-size:11px;color:var(--muted);line-height:1.7;padding:16px;border-top:1px solid var(--border);margin-top:6px;}
.btn-copy{display:block;width:100%;background:rgba(154,110,26,0.07);border:1px solid var(--border);border-radius:10px;padding:14px;font-family:'Nanum Myeongjo',serif;font-size:15px;color:var(--gold);cursor:pointer;margin-top:12px;transition:all 0.2s;}
.btn-copy:hover{background:rgba(154,110,26,0.13);}
.btn-retry{display:block;width:100%;background:#faf8f4;border:1px solid var(--border);border-radius:10px;padding:13px;font-family:'Nanum Myeongjo',serif;font-size:14px;color:var(--muted);cursor:pointer;margin-top:10px;transition:all 0.2s;}
.btn-retry:hover{border-color:var(--gold);color:var(--gold);}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(40,25,5,0.92);border:1px solid var(--border);color:#fff;border-radius:100px;padding:12px 24px;font-size:13px;opacity:0;transition:all 0.3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="wrap">

<!-- 인트로 -->
<div id="screen-intro">
  <div class="intro-symbol">☯</div>
  <h1 class="intro-title">나에게 맞는<br>집터 풍수 분석</h1>
  <div class="intro-divider"></div>
  <p class="intro-sub">생년월일시와 성별을 입력하면 오행을 분석해<br>방위·지역·나라·도시·인테리어까지 알려드려요</p>
  <div class="ohang-row">
    <span class="chip mok">木 목</span>
    <span class="chip hwa">火 화</span>
    <span class="chip to">土 토</span>
    <span class="chip gum">金 금</span>
    <span class="chip su">水 수</span>
  </div>

  <div class="form-card">
    <!-- 성별 -->
    <label class="flabel">성별 선택</label>
    <div class="toggle" style="margin-bottom:20px">
      <button class="tbtn on" id="btn-male">♂ 남성 (陽)</button>
      <button class="tbtn" id="btn-female">♀ 여성 (陰)</button>
    </div>

    <!-- 음양력 -->
    <label class="flabel">양력 / 음력 선택</label>
    <div class="toggle">
      <button class="tbtn on" id="btn-solar">양력 (陽曆)</button>
      <button class="tbtn" id="btn-lunar">음력 (陰曆)</button>
    </div>
    <div class="lunar-note" id="lunar-note">
      ※ 음력 입력 시 내부적으로 양력으로 변환하여 계산합니다. 윤달 여부가 중요한 경우 전문 역술가에게 확인하세요.
    </div>

    <!-- 생년월일 -->
    <label class="flabel" style="margin-top:16px">생년월일 및 태어난 시간</label>
    <div class="frow">
      <input class="finput" type="number" id="inp-year" placeholder="출생연도 (예: 1990)" min="1900" max="2024">
      <select class="finput fsel" id="inp-month">
        <option value="">월 선택</option>
        <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option>
        <option value="4">4월</option><option value="5">5월</option><option value="6">6월</option>
        <option value="7">7월</option><option value="8">8월</option><option value="9">9월</option>
        <option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
      </select>
    </div>
    <div class="frow">
      <select class="finput fsel" id="inp-day"><option value="">일 선택</option></select>
      <select class="finput fsel" id="inp-hour">
        <option value="12">태어난 시간 (모름)</option>
        <option value="0">자시 (子 · 23~01시)</option>
        <option value="1">축시 (丑 · 01~03시)</option>
        <option value="2">인시 (寅 · 03~05시)</option>
        <option value="3">묘시 (卯 · 05~07시)</option>
        <option value="4">진시 (辰 · 07~09시)</option>
        <option value="5">사시 (巳 · 09~11시)</option>
        <option value="6">오시 (午 · 11~13시)</option>
        <option value="7">미시 (未 · 13~15시)</option>
        <option value="8">신시 (申 · 15~17시)</option>
        <option value="9">유시 (酉 · 17~19시)</option>
        <option value="10">술시 (戌 · 19~21시)</option>
        <option value="11">해시 (亥 · 21~23시)</option>
      </select>
    </div>
    <p class="fhint">※ 태어난 시간을 모르시면 '모름'을 선택해주세요.</p>
    <button class="btn-go" id="btn-analyze">✦ 풍수 분석하기 ✦</button>
  </div>
</div>

<!-- 로딩 -->
<div class="loading" id="screen-loading">
  <div class="loading-symbol">☯</div>
  <p class="loading-text">사주를 분석하고 있습니다...</p>
</div>

<!-- 결과 -->
<div id="screen-result"></div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── 상태 변수 ──
var gender = 'male';
var calType = 'solar';

// ── 성별 토글 ──
document.getElementById('btn-male').addEventListener('click', function() {
  gender = 'male';
  document.getElementById('btn-male').className = 'tbtn on';
  document.getElementById('btn-female').className = 'tbtn';
});
document.getElementById('btn-female').addEventListener('click', function() {
  gender = 'female';
  document.getElementById('btn-male').className = 'tbtn';
  document.getElementById('btn-female').className = 'tbtn on';
});

// ── 음양력 토글 ──
document.getElementById('btn-solar').addEventListener('click', function() {
  calType = 'solar';
  document.getElementById('btn-solar').className = 'tbtn on';
  document.getElementById('btn-lunar').className = 'tbtn';
  document.getElementById('lunar-note').style.display = 'none';
});
document.getElementById('btn-lunar').addEventListener('click', function() {
  calType = 'lunar';
  document.getElementById('btn-solar').className = 'tbtn';
  document.getElementById('btn-lunar').className = 'tbtn on';
  document.getElementById('lunar-note').style.display = 'block';
});

// ── 음력 → 양력 변환 (근사값) ──
function lunarToSolar(y, m, d) {
  var off = [0,29,29,30,30,31,31,30,30,29,29,30,30];
  var sDay = d + off[m], sMonth = m + 1, sYear = y;
  var dim = [0,31,28,31,30,31,30,31,31,30,31,30,31];
  if ((sYear%4===0 && sYear%100!==0) || sYear%400===0) dim[2] = 29;
  if (sMonth > 12) { sMonth -= 12; sYear++; }
  if (sDay > dim[sMonth]) { sDay -= dim[sMonth]; sMonth++; }
  if (sMonth > 12) { sMonth -= 12; sYear++; }
  return { year: sYear, month: sMonth, day: sDay };
}

// ── 날짜 선택 ──
var monthSel = document.getElementById('inp-month');
var daySel = document.getElementById('inp-day');
function updateDays() {
  var m = parseInt(monthSel.value) || 0;
  var y = parseInt(document.getElementById('inp-year').value) || 2000;
  var days = m ? new Date(y, m, 0).getDate() : 31;
  var cur = daySel.value;
  daySel.innerHTML = '<option value="">일 선택</option>';
  for (var i = 1; i <= days; i++) {
    daySel.innerHTML += '<option value="' + i + '"' + (cur == i ? ' selected' : '') + '>' + i + '일</option>';
  }
}
monthSel.addEventListener('change', updateDays);
document.getElementById('inp-year').addEventListener('change', updateDays);
updateDays();

// ── 천간·지지 ──
var TG = ['갑(甲)','을(乙)','병(丙)','정(丁)','무(戊)','기(己)','경(庚)','신(辛)','임(壬)','계(癸)'];
var EG = ['자(子)','축(丑)','인(寅)','묘(卯)','진(辰)','사(巳)','오(午)','미(未)','신(申)','유(酉)','술(戌)','해(亥)'];
var TGO = ['목','목','화','화','토','토','금','금','수','수'];
var EGO = ['수','토','목','목','토','화','화','토','금','금','토','수'];
function gTGI(y) { return ((y-4)%10+10)%10; }
function gEGI(y) { return ((y-4)%12+12)%12; }
function gTG(y) { return TG[gTGI(y)]; }
function gEG(y) { return EG[gEGI(y)]; }
function gDay(y, m, d) {
  var dt = new Date(y, m-1, d), base = new Date(1900, 0, 1);
  var diff = Math.floor((dt - base) / 86400000);
  return { ti: ((diff%10)+10)%10, ei: ((diff%12)+12)%12 };
}
function calcO(y, m, d, h) {
  var s = { 목:0, 화:0, 토:0, 금:0, 수:0 };
  s[TGO[gTGI(y)]]++; s[EGO[gEGI(y)]]++;
  s[EGO[(m+1)%12]]++;
  var di = gDay(y, m, d);
  s[TGO[di.ti]]++; s[EGO[di.ei]]++;
  if (h < 12) { s[EGO[h%12]]++; s[TGO[(di.ti%5)*2+(h%2)]]++; }
  return s;
}

// ── 오행 데이터 ──
var OD = {
  목: {

// ── 분석 ──
document.getElementById('btn-analyze').addEventListener('click', function() {
  var year = parseInt(document.getElementById('inp-year').value);
  var month = parseInt(document.getElementById('inp-month').value);
  var day = parseInt(document.getElementById('inp-day').value);
  var hour = parseInt(document.getElementById('inp-hour').value);
  if (!year || year < 1900 || year > 2024) { showToast('올바른 출생연도를 입력해주세요'); return; }
  if (!month) { showToast('월을 선택해주세요'); return; }
  if (!day) { showToast('일을 선택해주세요'); return; }
  var calLabel = '양력';
  if (calType === 'lunar') {
    var s = lunarToSolar(year, month, day);
    year = s.year; month = s.month; day = s.day;
    calLabel = '음력→양력';
  }
  document.getElementById('screen-intro').style.display = 'none';
  document.getElementById('screen-loading').style.display = 'block';
  var g = gender, cl = calLabel;
  setTimeout(function() {
    document.getElementById('screen-loading').style.display = 'none';
    showResult(year, month, day, isNaN(hour) ? 12 : hour, cl, g);
  }, 1800);
});

// ── 결과 렌더링 ──
function showResult(year, month, day, hour, calLabel, g) {
  var scores = calcO(year, month, day, hour);
  var sorted = Object.entries(scores).sort(function(a,b){ return b[1]-a[1]; });
  var main = sorted[0][0], sub = sorted[1][0];
  var D = OD[main], sD = OD[sub];
  var di = gDay(year, month, day);
  var gLabel = g === 'male' ? '♂ 남성' : '♀ 여성';
  var saju = gTG(year) + gEG(year) + '년 · ' + month + '월 · ' + TG[di.ti] + EG[di.ei] + '일 (' + calLabel + ' · ' + gLabel + ')';
  var gd = D.성별[g];

  var html = '';

  // 헤더
  html += '<div class="rhead">';
  html += '<div class="rsaju">' + saju + '</div>';
  html += '<div class="rtitle">' + D.emoji + ' 주 오행은 <strong>' + D.name + '</strong></div>';
  html += '<p style="font-size:13px;color:var(--muted);margin-bottom:8px">' + D.desc + '</p>';
  html += '<span class="rbadge" style="' + D.bs + '">' + D.emoji + ' ' + D.name + ' &nbsp;+&nbsp; ' + sD.emoji + ' ' + sD.name + '</span>';
  html += '</div>';

  // 방위
  html += '<div class="sec" style="animation-delay:0.1s">';
  html += '<div class="shead"><span class="sicon">🧭</span><span class="stitle">나에게 맞는 집 방위</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<div class="compass-wrap">';
  html += '<div class="compass">';
  html += '<span class="cd cdn">北</span><span class="cd cds">南</span><span class="cd cde">東</span><span class="cd cdw">西</span>';
  html += '<div class="carrow" style="background:' + D.color + ';box-shadow:0 0 8px ' + D.color + ';transform:rotate(' + D.방.ga + 'deg)"></div>';
  html += '<div class="carrow" style="background:#e74c3c;opacity:0.4;transform:rotate(' + D.방.ba + 'deg)"></div>';
  html += '<div class="cctr"></div></div>';
  html += '<div class="dinfo">';
  html += '<div class="drow"><div class="ddot ddot-g"></div><div class="dtxt"><strong>길(吉) ' + D.방.good.join(', ') + '</strong><span>' + D.방.gd + '</span></div></div>';
  html += '<div class="drow"><div class="ddot ddot-b"></div><div class="dtxt"><strong>흉(凶) ' + D.방.bad.join(', ') + '</strong><span>' + D.방.bd + '</span></div></div>';
  html += '</div></div></div>';

  // 성별 맞춤
  html += '<div class="sec" style="animation-delay:0.15s">';
  html += '<div class="shead"><span class="sicon">' + (g==='male'?'♂':'♀') + '</span><span class="stitle">' + gLabel + ' · 성별 맞춤 풍수</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<div class="gender-box">';
  html += '<div style="font-size:11px;color:var(--muted);margin-bottom:5px">' + (g==='male'?'양(陽)':'음(陰)') + '의 기운 보정 방위</div>';
  html += '<div class="gender-dir" style="color:' + gd.color + '">✦ ' + gd.dir + '</div>';
  html += '<div class="gender-note">' + gd.note + '</div>';
  html += '</div>';
  html += '<div class="g2grid">';
  html += '<div class="g2card g2card-g"><div class="g2label g2label-g">✦ 잘 맞는 직업·분야</div><div class="g2val">' + gd.career + '</div></div>';
  html += '<div class="g2card g2card-b"><div class="g2label g2label-b">✕ 주의할 점</div><div class="g2val">' + gd.avoid + '</div></div>';
  html += '</div></div>';

  // 지역
  html += '<div class="sec" style="animation-delay:0.2s">';
  html += '<div class="shead"><span class="sicon">🗺️</span><span class="stitle">좋은 지역과 피해야 할 환경</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<div class="rgrid">';
  html += '<div class="rcard rcard-g"><div class="rlabel rlabel-g">✦ 좋은 환경</div><div class="ritems">' + D.지.good.map(function(r){ return '<span class="rtag rtag-g">'+r+'</span>'; }).join('') + '</div></div>';
  html += '<div class="rcard rcard-b"><div class="rlabel rlabel-b">✕ 피할 환경</div><div class="ritems">' + D.지.bad.map(function(r){ return '<span class="rtag rtag-b">'+r+'</span>'; }).join('') + '</div></div>';
  html += '</div>';
  html += '<p style="font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7">✦ ' + D.지.gd + '</p>';
  html += '<p style="font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7">✕ ' + D.지.bd + '</p>';
  html += '</div>';

  // 환경
  html += '<div class="sec" style="animation-delay:0.25s">';
  html += '<div class="shead"><span class="sicon">🏡</span><span class="stitle">이상적인 주거 환경</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<div class="elist">' + D.환.map(function(e){ return '<div class="eitem"><div class="eico">'+e.i+'</div><div><div class="etit">'+e.t+'</div><div class="edsc">'+e.d+'</div></div></div>'; }).join('') + '</div>';
  html += '</div>';

  // 나라·도시
  html += '<div class="sec" style="animation-delay:0.3s">';
  html += '<div class="shead"><span class="sicon">🌍</span><span class="stitle">나에게 잘 맞는 나라와 도시</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<span class="slabel">✦ 추천 나라</span>';
  html += '<div class="clist">' + D.나라.map(function(c){ return '<div class="citem"><div class="cflag">'+c.f+'</div><div><div class="cname">'+c.n+'</div><div class="creason">'+c.r+'</div></div></div>'; }).join('') + '</div>';
  html += '<span class="slabel">✦ 추천 도시</span>';
  html += '<div class="cgrid">' + D.도시.map(function(c){ return '<div class="ccard"><div class="ccname">📍 '+c.n+'</div><div class="ccreason">'+c.r+'</div></div>'; }).join('') + '</div>';
  html += '</div>';

  // 인테리어
  html += '<div class="sec" style="animation-delay:0.35s">';
  html += '<div class="shead"><span class="sicon">🎨</span><span class="stitle">인테리어 컬러 & 소재 추천</span></div>';
  html += '<div class="sdiv"></div>';
  html += '<span class="slabel">✦ 추천 컬러</span>';
  html += '<div class="colrow">' + D.인.c.map(function(c){ return '<div class="colchip"><div class="coldot" style="background:'+c.h+'"></div><div><div class="colname">'+c.n+'</div><div class="colmean">'+c.m+'</div></div></div>'; }).join('') + '</div>';
  html += '<span class="slabel">✦ 추천 소재</span>';
  html += '<div class="mtags">' + D.인.mat.map(function(m){ return '<span class="mtag">'+m+'</span>'; }).join('') + '</div>';
  html += '<span class="slabel" style="margin-top:12px">✕ 피할 소재·색상</span>';
  html += '<div class="mtags">' + D.인.av.map(function(m){ return '<span class="mtag mtag-bad">'+m+'</span>'; }).join('') + '</div>';
  html += '</div>';

  html += '<div class="disclaimer">본 분석은 전통 풍수지리 이론(청오경·금낭경)과 오행·음양론을 기반으로 한 참고용 콘텐츠입니다.<br>실제 주거 결정 시에는 전문 풍수사의 상담을 받으시기를 권장해요.</div>';
  html += '<button class="btn-copy" id="btn-copy">🔗 결과 링크 복사</button>';
  html += '<button class="btn-retry" id="btn-retry">↺ 다시 분석하기</button>';

  var el = document.getElementById('screen-result');
  el.style.display = 'block';
  el.innerHTML = html;

  document.getElementById('btn-copy').addEventListener('click', function() {
    var text = '🏡 나의 풍수 분석\n주 오행: ' + D.name + ' ' + D.emoji + '\n성별: ' + gLabel + '\n' + D.desc + '\n\n✦ 좋은 방위: ' + D.방.good.join(', ') + '\n✦ 성별 보정 방위: ' + gd.dir + '\n✦ 추천 나라: ' + D.나라.slice(0,2).map(function(c){return c.n;}).join(', ') + '\n\n' + window.location.href;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function(){ showToast('결과가 복사됐어요! 🏡'); });
    } else {
      var t = document.createElement('textarea');
      t.value = text; t.style.cssText = 'position:fixed;top:-9999px;opacity:0';
      document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); showToast('결과가 복사됐어요! 🏡'); } catch(e) {}
      document.body.removeChild(t);
    }
  });
  document.getElementById('btn-retry').addEventListener('click', function() {
    document.getElementById('screen-result').style.display = 'none';
    document.getElementById('screen-result').innerHTML = '';
    document.getElementById('screen-intro').style.display = 'flex';
  });
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2800);
}
</script>
